plugin-crabbox:
    candy:
        description: |-
            OUT-OF-TREE charly plugin serving the `crabbox` check verb — a standalone
            Go module (go.mod + main.go) that probes the Crabbox CLI and its optional
            local coordinator, served OUT-OF-PROCESS over go-plugin gRPC via the charly
            plugin SDK (github.com/opencharly/sdk). charly's loader fetches this candy's
            repo, go-builds the provider binary on the HOST, and serves it via
            LocalTransport — so an authored `crabbox:` step dispatches through the
            provider registry exactly like a built-in.

            The verb has FOUR method classes. In-venue CLI methods (version/providers/
            describe/config/doctor — credential-free — and leases/usage/events/logs —
            broker-backed, requiring a `crabbox login` in the venue) run the `crabbox`
            binary INSIDE the venue over the reverse channel (cc.Exec). `describe`
            answers the CLI's own provider description (`providers describe <name>
            --json`) so a bed asserts the containerd provider from the CLI's vocabulary,
            not from a transcribed list. `containerd-preflight` is the read-only gate for
            a containerd lease: it runs the real probes in the venue and returns a
            VISIBLE SKIP naming the exact absent dependency (a CLI built before the W2
            provider work, an unreachable daemon, missing xt_multiport, an unpublished
            lease image) instead of a mock or a false pass. Coordinator HTTP probe
            methods (health/ready) hit the Node.js/PostgreSQL coordinator's /v1/health and
            /v1/ready endpoints from the charly host against the resolved endpoint
            (cc.ResolveEndpoint + cc.HTTPDo, one authored step works unchanged against a
            pod's published port and a VM's forwarded one). No method creates, mutates,
            or releases a lease; the preflight's only write is a `nerdctl pull` that
            proves the lease image exists.

            It is NOT a re-skin of the generic `command:`/`http:` verbs: this plugin
            exists for what those structurally cannot do — ENDPOINT RESOLUTION
            (cc.ResolveEndpoint for the coordinator probes) and DOMAIN SEMANTICS
            (methods map to the crabbox CLI's real surface and return real verdicts,
            with `json_path:` to assert one field; the in-venue CLI methods reach the
            binary where it is installed, which `http:` cannot).

            The R10 consumers are the crabbox-bearing beds (check-crabbox-pod,
            check-crabbox-containerd-e2e and the distro beds) whose checks compose this
            plugin alongside the `crabbox` CLI candy from opencharly/layer-crabbox and
            the coordinator candy from opencharly/pod-crabbox.
        plugin:
            source: github.com/opencharly/plugin-crabbox/candy/plugin-crabbox
            providers:
                - verb:crabbox
            primary:
                crabbox: method
        plan:
            - check: the crabbox verb dispatches through the provider registry and answers with the in-venue CLI's version
              id: crabbox-verb-dispatches
              crabbox:
                method: version
              stdout:
                - matches: "([0-9]+\\.[0-9]+\\.[0-9]+|[0-9a-f]{7,40})"
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: the containerd provider preflight passes, or a visible SKIP names the exact absent dependency (CLI pin, daemon, xt_multiport, lease image)
              id: crabbox-containerd-preflight
              crabbox:
                method: containerd-preflight
                provider: containerd
                containerd:
                  runtime: crun
                  image: ghcr.io/opencharly/pod-crabbox:2026.293.1655
              timeout: 600s
              context:
                - runtime
crabbox-skill:
    skill:
        name: crabbox
        family: check
        owner: plugin-crabbox
        description: |-
            the `crabbox:` check verb — probe the Crabbox CLI or its local coordinator
            (version/providers/config/doctor, coordinator health/ready via /v1/health
            and /v1/ready, and broker-backed leases/usage/events/logs), served
            out-of-process by plugin-crabbox.
        triggers:
            - "the `crabbox:` check verb / probing the Crabbox CLI or coordinator from a candy or box plan"
