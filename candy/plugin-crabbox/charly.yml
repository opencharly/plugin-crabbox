version: 2026.240.1943
plugin-crabbox:
    candy:
        version: 2026.247.0100
        description: |-
            OUT-OF-TREE charly plugin serving the `crabbox` check verb — a standalone
            Go module (go.mod + main.go) that probes the Crabbox CLI and its optional
            local coordinator, served OUT-OF-PROCESS over go-plugin gRPC via the charly
            plugin SDK (github.com/opencharly/sdk). charly's loader fetches this candy's
            repo, go-builds the provider binary on the HOST, and serves it via
            LocalTransport — so an authored `crabbox:` step dispatches through the
            provider registry exactly like a built-in.

            The verb has THREE method classes. In-venue CLI methods (version/providers/
            config/doctor — credential-free — and leases/usage/events/logs —
            broker-backed, requiring a `crabbox login` in the venue) run the `crabbox`
            binary INSIDE the venue over the reverse channel (cc.Exec). Coordinator
            HTTP probe methods (health/ready) hit the Node.js/PostgreSQL coordinator's
            /v1/health and /v1/ready endpoints — the container-probe surface the
            coordinator exposes — from the charly host against the resolved endpoint
            (cc.ResolveEndpoint + cc.HTTPDo, one authored step works unchanged against a
            pod's published port and a VM's forwarded one). All methods are read-only;
            there are no mutating methods in this first cut.

            It is NOT a re-skin of the generic `command:`/`http:` verbs: this plugin
            exists for what those structurally cannot do — ENDPOINT RESOLUTION
            (cc.ResolveEndpoint for the coordinator probes) and DOMAIN SEMANTICS
            (methods map to the crabbox CLI's real surface and return real verdicts,
            with `json_path:` to assert one field; the in-venue CLI methods reach the
            binary where it is installed, which `http:` cannot).

            The R10 consumers are the crabbox-bearing beds (check-crabbox-pod and
            check-crabbox-e2e-pod) whose checks compose this plugin alongside the
            `crabbox` CLI candy from opencharly/layer-crabbox and the coordinator candy
            from opencharly/pod-crabbox.
        plugin:
            source: github.com/opencharly/plugin-crabbox/candy/plugin-crabbox
            providers:
                - verb:crabbox
            primary:
                crabbox: method
        plan:
            - check: the crabbox verb dispatches through the provider registry and reports the pinned CLI version on a live deployment
              id: crabbox-verb-dispatches
              crabbox: version
              stdout:
                - contains: "0.48.1"
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime

crabbox-skill:
    skill:
        name: crabbox
        family: check
        owner: plugin-crabbox
        description: |-
            the `crabbox:` check verb — probe the Crabbox CLI or its local coordinator
            (version/providers/config/doctor, coordinator health/ready via /v1/health
            and /v1/ready, and broker-backed leases/usage/events/logs), served
            out-of-process by plugin-crabbox.
        triggers:
            - "the `crabbox:` check verb / probing the Crabbox CLI or coordinator from a candy or box plan"
        content: |
            # crabbox — check verb

            ## Overview

            `crabbox:` probes the [Crabbox](https://github.com/openclaw/crabbox) CLI
            and its optional local Node.js/PostgreSQL coordinator, served
            out-of-process over go-plugin gRPC by `opencharly/plugin-crabbox`.
            Install the CLI with `/charly-tools:crabbox` (opencharly/layer-crabbox)
            and the coordinator with `/charly-crabbox:crabbox-coordinator`
            (opencharly/pod-crabbox).

            ## Why it is not the `command:`/`http:` verbs

            - **Endpoint resolution.** `cc.ResolveEndpoint` turns the in-venue
              coordinator port into a host-reachable address, so one authored step works
              unchanged against a pod's published port and a VM's forwarded one.
            - **Domain semantics.** Methods map to the CLI's real surface and return real
              verdicts, with `json_path:` to assert one field.
            - **In-venue CLI.** The CLI methods run the `crabbox` binary inside the venue
              over the reverse channel — `http:` cannot reach the CLI at all.

            ## Methods

            | Group | Methods |
            |---|---|
            | In-venue CLI — credential-free | `version` (`crabbox --version`) `providers` (`crabbox providers`) `config` (`crabbox config show`) `doctor` (`crabbox doctor` — needs NO broker configured, or a REACHABLE one) |
            | Coordinator HTTP probe (host-side, port 8080) | `health` (`/v1/health`) `ready` (`/v1/ready`) |
            | In-venue CLI — broker-backed (requires `crabbox login` in the venue) | `leases` (`crabbox status --all`) `usage` (`crabbox usage`) `events` (`crabbox events <run_id>`) `logs` (`crabbox logs <run_id>`) |

            All methods are read-only — there are no mutating methods in this first cut.

            ## Input fields

            | Field | Meaning |
            |---|---|
            | `method` | the operation (also the scalar-sugar primary: `crabbox: version`) |
            | `port` | coordinator port for health/ready probes (default 8080) |
            | `timeout` | HTTP probe timeout (default 10s) |
            | `json_path` | dotted path into the response; stdout becomes that value |
            | `run_id` | run identifier for the `events`/`logs` methods |

            ## Scalar shorthand

            ```yaml
            crabbox: version          # scalar sugar
            crabbox:                  # map form — identical meaning
              method: version
            ```

            The sugar is enabled by this candy's `plugin.primary: {crabbox: method}`,
            which charly reads in a PRE-CONNECT prescan — so the plugin candy must be
            composed into the box that authors the step.

            ## Credential-free vs broker-backed

            `version`/`providers`/`config`/`doctor` work with no coordinator and no
            login (fresh HOME). `leases`/`usage`/`events`/`logs` talk to the configured
            broker — the venue must hold a prior `crabbox login` (shared-token:
            `crabbox login --url http://127.0.0.1:8080 --token-stdin`). `doctor` exits
            nonzero when a broker is configured but unreachable — gate it on
            coordinator readiness first.